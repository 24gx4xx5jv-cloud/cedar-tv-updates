name: Deploy update manifest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - test/**
      - scripts/verify_public_site.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify Cedar Link assets and configuration
        run: |
          node --check public/link/link.js
          node --check public/link/cedar-sync.mjs
          node --test test/link-sync.test.mjs
          node scripts/verify_public_site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static update files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
